<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ShopAccess E1</title><link rel="stylesheet" href="styles.css"><script type="module" src="panel.mjs"></script></head><body>
<a href="#heading">Skip to conversation</a><main id="main" tabindex="-1"><h1>ShopAccess E1</h1><p id="notice">Synthetic local mock. No live AI, shopping or payments.</p><p id="extension-id"></p>
<button id="pair">Pair with website</button><button id="refresh">Refresh conversation</button><button id="disconnect">Forget local pairing</button>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><p id="announce" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
<label for="language" id="language-label">Interface language</label><select id="language"><option value="en">English</option><option value="es">Español</option></select>
<h2 id="heading" tabindex="-1">Conversation</h2><p id="trimmed"></p><ol id="history"></ol>
<form id="turn-form"><label for="text" id="text-label">Message</label><textarea id="text" maxlength="2000" required></textarea><button type="submit" id="send">Send</button></form>
</main></body></html>
